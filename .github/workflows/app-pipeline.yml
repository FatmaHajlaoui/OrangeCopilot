name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: orangecopilot:latest

      - name: Run tests
        run: |
          docker compose up -d
          sleep 10
          docker compose exec -T web python -m pytest

      - name: Clean up
        if: always()
        run: |
          docker compose down